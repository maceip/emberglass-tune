[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "emberglass-tune"
version = "0.1.0"
description = "LoRA / SFT training and MLX/CUDA eval for VibeThinker-3B."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "maceip" }]
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "datasets>=2.20",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.19"]
anthropic = ["anthropic>=0.34"]

[project.scripts]
emberglass-tune = "emberglass_tune.cli:main"

[project.urls]
Repository = "https://github.com/maceip/emberglass-tune"

[tool.hatch.build.targets.wheel]
packages = ["emberglass_tune"]

[tool.uv]
package = true
