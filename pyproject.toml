[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emberglass-tune"
version = "0.1.0"
description = "LoRA / SFT training for Qwen2.5-class models (VibeThinker). Forward-pass lives in emberglass."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "datasets>=2.20",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.19"]
anthropic = ["anthropic>=0.34"]

[project.scripts]
emberglass-tune = "emberglass_tune.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emberglass_tune*"]
